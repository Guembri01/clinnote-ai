# Alembic Configuration for ClinNote AI
# ========================================

[alembic]
# Path to migration scripts
script_location = migrations

# Template used for new migration files
file_template = %%(rev)s_%%(slug)s

# sys.path modification (empty = no modification)
prepend_sys_path = .

# Truncate length of auto-generated migration slugs
truncate_slug_length = 40

# Set to 'true' to enable schema comparison for column types
compare_type = true

# Set to 'true' to enable schema comparison for server defaults
compare_server_default = true

# Database URL — override with environment variable
# Use ${DATABASE_URL} env interpolation
sqlalchemy.url = postgresql+asyncpg://clinnote:changeme@localhost:5432/clinnote_ai


[post_write_hooks]
# No post-write hooks configured


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
